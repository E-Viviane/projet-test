    patch:
      summary: Modifier partiellement un ticket
      tags:
      - Tickets
      description: 'Accès : **connecté**.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              priorite: critique
      responses:
        '200':
          description: Succès
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
