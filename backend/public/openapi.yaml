  /tickets:
    get:
      summary: 'Lister les tickets : filtres, tri, pagination, inclusions'
      tags:
      - Tickets
      description: 'Accès : **connecté**. Un utilisateur ne voit que ses tickets ; agents et admins voient tout'
      parameters:
      - name: statut
        in: query
        required: false
        schema:
          type: string
        example: nouveau,en_cours
      - name: priorite
        in: query
        required: false
        schema:
          type: string
        example: haute,critique
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
        example: '3'
      - name: auteur_id
        in: query
        required: false
        schema:
          type: string
        example: '2'
      - name: q
        in: query
        required: false
        schema:
          type: string
        example: imprimante
      - name: tag
        in: query
        required: false
        schema:
          type: string
        example: reseau
      - name: cree_apres
        in: query
        required: false
        schema:
          type: string
        example: '2026-10-01'
      - name: cree_avant
        in: query
        required: false
        schema:
          type: string
        example: '2026-10-31'
      - name: en_retard
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: tri
        in: query
        required: false
        schema:
          type: string
        example: -priorite,created_at
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '2'
      - name: per_page
        in: query
        required: false
        schema:
          type: string
        example: '20'
      - name: pagination
        in: query
        required: false
        schema:
          type: string
        example: page
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: valeur
      - name: inclure
        in: query
        required: false
        schema:
          type: string
        example: auteur,agent,tags,commentaires,pieces_jointes
      responses:
        '200':
          description: Succès
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
      security:
      - bearerAuth: []
    post:
      summary: Créer un ticket (201 + Location ; en-tête Idempotency-Key supporté)
      tags:
      - Tickets
      description: 'Accès : **connecté**.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 'Valeur unique (8–100 car.) : un renvoi identique rejoue la réponse sans créer de doublon.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              titre: Imprimante en panne
              description: Plus de papier détecté par le capteur
              priorite: haute
              echeance: '2026-12-31'
              tags:
              - 1
              - 2
      responses:
        '201':
          description: Créé (en-tête Location)
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
      security:
      - bearerAuth: []
