        '422':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
      security:
      - bearerAuth: []
  /auth/mot-de-passe:
    put:
      summary: Changer mon mot de passe (révoque mes autres jetons)
      tags:
      - Auth
      description: 'Accès : **connecté**.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              mot_de_passe_actuel: password
              password: nouveau123
              password_confirmation: nouveau123
      responses:
        '204':
          description: Succès sans contenu
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
