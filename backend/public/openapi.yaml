openapi: 3.0.3
info:
  title: API Helpdesk (Laravel + MySQL)
  version: 1.0.0
  description: 'API REST de gestion de tickets d''assistance : authentification par jetons Sanctum, CRUD, filtres, tri, pagination,
    relations imbriquées, fichiers, corbeille, statistiques.


    Comptes de démonstration (mot de passe `password`) : admin@demo.test, agent@demo.test, user@demo.test.


    Format d''erreur uniforme : `{"message": "...", "code": "identifiant_stable", ...}` ; en 422 s''ajoute `errors` (par champ).'
servers:
- url: http://127.0.0.1:8000/api/v1
  description: Serveur local (php artisan serve)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Jeton obtenu par /auth/connexion : Authorization: Bearer <jeton>'
  schemas:
    Erreur:
      type: object
      required:
      - message
      - code
      properties:
        message:
          type: string
          example: Transition impossible.
        code:
          type: string
          example: transition_invalide
        errors:
          type: object
          description: 'Présent en 422 : tableau de messages par champ'
          additionalProperties:
            type: array
            items:
              type: string
paths:
  /:
    get:
      summary: 'Point d''entrée : liste des ressources'
      tags:
      - Système
      description: 'Accès : **public**.'
      responses:
        '200':
          description: Succès
  /sante:
    get:
      summary: Sonde de supervision (base de données)
      tags:
      - Système
      description: 'Accès : **public**.'
      responses:
        '200':
          description: Succès
        '503':
          description: Service indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /demo/codes/{code}:
    get:
      summary: Provoque un code HTTP (local/testing seulement)
      tags:
      - Système
      description: 'Accès : **public**. code : 200, 201, 204, 400, 401, 403, 404, 409, 422, 429, 500, 503'
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Succès
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: Interdit (droits ou capacité du jeton)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: Introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: Conflit avec l'état de la ressource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '429':
          description: Trop de requêtes (en-tête Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '500':
          description: Erreur serveur
        '503':
          description: Service indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /auth/inscription:
    post:
      summary: Créer un compte (rôle user) et recevoir un jeton
      tags:
      - Auth
      description: 'Accès : **public**.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Marie Dossou
              email: marie@demo.test
              password: motdepasse1
              password_confirmation: motdepasse1
      responses:
        '201':
          description: Créé (en-tête Location)
        '422':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '429':
          description: Trop de requêtes (en-tête Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /auth/connexion:
    post:
      summary: 'Se connecter : jeton Bearer valable 8 h'
      tags:
      - Auth
      description: 'Accès : **public**. 5 essais/minute par email+IP'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              email: user@demo.test
              password: password
              appareil: mon-portable
      responses:
        '200':
          description: Succès
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '429':
          description: Trop de requêtes (en-tête Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /auth/moi:
    get:
      summary: Mon profil
      tags:
      - Auth
      description: 'Accès : **connecté**.'
      responses:
        '200':
          description: Succès
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
      security:
      - bearerAuth: []
    patch:
      summary: Modifier mon nom / email
      tags:
      - Auth
      description: 'Accès : **connecté**.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Nouveau Nom
      responses:
        '200':
          description: Succès
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
