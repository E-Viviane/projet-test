  /tickets/actions-groupees:
    post:
      summary: 'Changer le statut de plusieurs tickets (207 : résultat par ticket)'
      tags:
      - Tickets
      description: 'Accès : **agent**.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              ids:
              - 1
              - 2
              - 3
              statut: en_cours
      responses:
        '207':
          description: Succès partiel (résultat par élément)
        '401':
          description: Non authentifié (jeton absent, invalide ou expiré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
